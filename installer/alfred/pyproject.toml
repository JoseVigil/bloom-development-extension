[project]
name = "bloom-alfred"
version = "0.1.0"
description = "Alfred — núcleo conversacional real de Bloom. Capa de voz sobre el custodio de gobernanza (nucleus alfred start)."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
]

[tool.setuptools.packages.find]
where = ["src"]
